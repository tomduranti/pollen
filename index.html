  <title>Pollen</title>
  <script type="module" crossorigin src="/pollen/assets/index-Bttib-DF.js"></script>
  <link rel="stylesheet" crossorigin href="/pollen/assets/index-DRO9UZK8.css">
</head>

<body>
  <div id="root"></div>
  <script>
    (function (l) {
      if (l.search[1] === 'p') {
        var decoded = l.search.slice(1).split('&')
          .find(function (s) { return s.startsWith('p='); })
          .slice(2).split('~').join('&');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded.charAt(0) === '/' ? '' : '/') + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</body>

</html>
